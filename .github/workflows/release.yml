name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            target: linux-amd64
          - os: ubuntu-latest
            arch: arm64
            target: linux-arm64
          - os: windows-latest
            arch: amd64
            target: windows-amd64
          - os: macos-latest
            arch: amd64
            target: darwin-amd64
          - os: macos-latest
            arch: arm64
            target: darwin-arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Get dependencies
      run: go mod download

    - name: Build
      env:
        GOOS: ${{ contains(matrix.target, 'windows') && 'windows' || contains(matrix.target, 'darwin') && 'darwin' || 'linux' }}
        GOARCH: ${{ matrix.arch }}
      run: |
        version="${{ github.ref_name }}"
        output="go-rag-${GOOS}-${GOARCH}"
        if [ "${GOOS}" = "windows" ]; then
          output="${output}.exe"
        fi
        go build -ldflags="-s -w -X main.version=${version}" -o "${output}" ./cmd/go-rag
      shell: bash

    - name: Create archive (Unix)
      if: ${{ !contains(matrix.target, 'windows') }}
      run: |
        version="${{ github.ref_name }}"
        GOOS="${{ contains(matrix.target, 'darwin') && 'darwin' || 'linux' }}"
        GOARCH="${{ matrix.arch }}"
        output="go-rag-${GOOS}-${GOARCH}"
        tar -czf "go-rag-${version}-${GOOS}-${GOARCH}.tar.gz" "${output}" README.md LICENSE
      shell: bash

    - name: Create archive (Windows)
      if: contains(matrix.target, 'windows')
      run: |
        $version = "${{ github.ref_name }}"
        $output = "go-rag-windows-amd64.exe"
        Compress-Archive -Path $output, README.md, LICENSE -DestinationPath "go-rag-${version}-windows-amd64.zip"
      shell: pwsh

    - name: Upload artifact (binary)
      uses: actions/upload-artifact@v4
      with:
        name: go-rag-${{ matrix.target }}-binary
        path: |
          go-rag-linux-*
          go-rag-darwin-*
          go-rag-windows-*.exe

    - name: Upload artifact (archive)
      uses: actions/upload-artifact@v4
      with:
        name: go-rag-${{ matrix.target }}
        path: go-rag-*.tar.gz

    - name: Upload Windows artifact (archive)
      if: contains(matrix.target, 'windows')
      uses: actions/upload-artifact@v4
      with:
        name: go-rag-${{ matrix.target }}-zip
        path: go-rag-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/**/go-rag-*
        generate_release_notes: true
        draft: false
        prerelease: false
